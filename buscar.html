<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Demo conceptual · SV2 Labs</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root {
                --navy: #07111f;
                --navy-800: #0c1a30;
                --ink: #f4f1ea;
                --muted: #9aa6b8;
                --gold: #fcd116;
                --line: rgba(255, 255, 255, 0.12);
            }
            .staticrypt-html, .staticrypt-body {
                height: 100%;
                margin: 0;
            }
            .staticrypt-content {
                min-height: 100%;
                margin-bottom: 0;
                background:
                    radial-gradient(900px 420px at 80% -10%, rgba(252, 209, 22, 0.12), transparent 55%),
                    radial-gradient(700px 400px at 10% 110%, rgba(0, 56, 147, 0.35), transparent 55%),
                    #07111f;
                font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
                -webkit-font-smoothing: antialiased;
                color: var(--ink);
            }
            .staticrypt-content::before {
                content: "";
                display: block;
                height: 3px;
                background: linear-gradient(90deg, #fcd116 0 33.33%, #003893 33.33% 66.66%, #ce1126 66.66%);
            }
            .staticrypt-page {
                width: min(400px, calc(100% - 32px));
                padding: 12vh 0 48px;
                margin: auto;
                box-sizing: border-box;
            }
            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: rgba(12, 26, 48, 0.86);
                border: 1px solid var(--line);
                max-width: 400px;
                margin: 0 auto;
                padding: 40px 36px 36px;
                text-align: center;
                border-radius: 20px;
                box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
                backdrop-filter: blur(16px);
            }
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 24px;
                border: 0;
                border-top: 1px solid var(--line);
            }
            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box;
                font-size: 15px;
                outline: 0;
                padding: 15px 40px 15px 15px;
                width: 100%;
                color: var(--ink);
            }
            .staticrypt-form input::placeholder {
                color: var(--muted);
            }
            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: rgba(255, 255, 255, 0.06);
                width: 100%;
                border: 1px solid var(--line);
                border-radius: 12px;
                margin: 0 0 16px;
                box-sizing: border-box;
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 70%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
                filter: invert(1);
            }
            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: none;
                outline: 0;
                background: #fcd116;
                width: 100%;
                border: 0;
                padding: 14px;
                color: #07111f;
                font-size: 15px;
                font-weight: 700;
                letter-spacing: 0.01em;
                cursor: pointer;
                border-radius: 12px;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #fcd116;
                filter: brightness(96%);
            }
            .staticrypt-instructions {
                margin-top: 0;
                margin-bottom: 0.5em;
                color: var(--muted);
                font-size: 14px;
                line-height: 1.5;
            }
            .staticrypt-title {
                font-size: 1.35em;
                font-weight: 650;
                letter-spacing: -0.03em;
                color: var(--ink);
                margin: 0 0 10px;
            }
            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1.1em;
                color: var(--muted);
                font-size: 14px;
                text-align: left;
            }
            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.25);
                margin-right: 0.75em;
                accent-color: var(--gold);
            }
            .hidden { display: none !important; }
            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--navy);
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid rgba(255,255,255,0.25);
                border-right-color: var(--gold);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }
            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] { font-size: 16px; }
            }
        </style>
    </head>
